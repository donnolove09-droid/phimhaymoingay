<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kết quả thanh toán - PhimHay</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0b;color:#f5f5f7;font-family:system-ui,sans-serif;padding:20px}
.box{max-width:420px;width:100%;background:#141416;border:1px solid #26262b;border-radius:12px;padding:32px;text-align:center}
h1{font-size:20px;margin:0 0 12px}.ok{color:#22c55e}.bad{color:#ff4757}
code{display:block;margin:16px 0;padding:14px;background:#0a0a0b;border:2px dashed #e50914;border-radius:8px;color:#e50914;font-size:18px;word-break:break-all}
a{display:inline-block;margin-top:12px;background:#e50914;color:#fff;text-decoration:none;padding:10px 22px;border-radius:6px}
p{color:#9a9aa3;line-height:1.6}
</style></head><body><div class="box" id="box"></div>
<script>
const q=new URLSearchParams(location.search),st=q.get('status'),key=q.get('key'),order=q.get('order');
const msg={failed:'Thanh toán thất bại hoặc đã bị huỷ.',notfound:'Không tìm thấy đơn hàng.',invalid:'Giao dịch không hợp lệ.',error:'Có lỗi xảy ra, vui lòng liên hệ admin.',pending:'Đang chờ xác nhận thanh toán.'};
const b=document.getElementById('box');const e=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
if(st==='success'){
 b.innerHTML='<h1 class="ok">Thanh toán thành công</h1>'+(order?'<p>Mã đơn: '+e(order)+'</p>':'')+
 (key?'<p>Key của bạn:</p><code>'+e(key)+'</code>':'<p>Key đã được gửi qua Telegram. Nếu chưa thấy, gõ /mykeys với bot.</p>')+'<a href="/">Về trang xem phim</a>';
}else{
 b.innerHTML='<h1 class="bad">Không thành công</h1><p>'+e(msg[st]||msg.error)+'</p><a href="/">Về trang chủ</a>';
}
</script></body></html>
