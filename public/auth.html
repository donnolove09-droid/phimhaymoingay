<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — PhimHay</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="getkey.css">
<style>
.tabs{display:flex;gap:8px;margin-bottom:24px}
.tabs button{flex:1;padding:11px;background:transparent;border:1px solid var(--border);color:var(--text-dim);border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px}
.form-group input{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:border-color .2s}
.form-group input:focus{border-color:var(--accent)}
.otp-inputs{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.otp-inputs input{width:44px;height:52px;text-align:center;font-size:22px;font-weight:700;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border-color .2s}
.otp-inputs input:focus{border-color:var(--accent)}
.resend{text-align:center;font-size:13px;color:var(--text-dim);margin-top:14px}
.resend button{background:none;border:none;color:var(--accent);cursor:pointer;font-family:inherit;font-size:13px;text-decoration:underline}
.error-msg{color:#ff4757;font-size:13px;text-align:center;margin-top:12px;min-height:20px}
</style>
</head>
<body>
<div class="container">
<a href="/" class="back">Về trang chủ</a>
<div class="card">
<div class="card-header">
<h1 id="pageTitle">Đăng nhập</h1>
<p id="pageDesc">Chào mừng trở lại PhimHay</p>
</div>
<div class="card-body">

<div class="tabs">
<button id="tabLogin" class="active">Đăng nhập</button>
<button id="tabRegister">Đăng ký</button>
</div>

<div class="state" id="stateForm">
<div class="form-group" id="emailGroup" style="display:none">
<label>Email</label>
<input type="email" id="inputEmail" placeholder="email@example.com" autocomplete="email">
</div>
<div class="form-group">
<label id="labelUser">Email hoặc username</label>
<input type="text" id="inputUsername" placeholder="Nhập email hoặc username" autocomplete="username">
</div>
<div class="form-group">
<label>Mật khẩu</label>
<input type="password" id="inputPassword" placeholder="Tối thiểu 6 ký tự" autocomplete="current-password">
</div>
<button class="btn-primary" id="btnSubmit">Đăng nhập</button>
<div class="error-msg" id="errorMsg"></div>
</div>

<div class="state hidden" id="stateOtp">
<p style="text-align:center;color:var(--text-dim);margin-bottom:20px;font-size:14px">Nhập mã 6 số đã gửi đến email</p>
<div class="otp-inputs">
<input type="tel" maxlength="1" inputmode="numeric" class="otp-input">
<input type="tel" maxlength="1" inputmode="numeric" class="otp-input">
<input type="tel" maxlength="1" inputmode="numeric" class="otp-input">
<input type="tel" maxlength="1" inputmode="numeric" class="otp-input">
<input type="tel" maxlength="1" inputmode="numeric" class="otp-input">
<input type="tel" maxlength="1" inputmode="numeric" class="otp-input">
</div>
<button class="btn-primary" id="btnVerifyOtp">Xác thực</button>
<div class="resend">Không nhận được mã? <button id="btnResend">Gửi lại</button></div>
<div class="error-msg" id="otpError"></div>
</div>

<div class="state hidden" id="stateDone">
<div class="success-icon"></div>
<h2 style="text-align:center;font-size:20px;margin-bottom:6px">Thành công</h2>
<p style="text-align:center;color:var(--text-dim);font-size:14px">Đang chuyển hướng...</p>
</div>

</div>
</div>
</div>
<script src="auth.js"></script>
</body>
</html>
